name: Verify Package Repository Integrity

on:
  push:
    branches: [main, gh-pages]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Cryptographic & Structural Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify OpenPGP Public Key
        run: |
          test -f bobine.gpg
          FP=$(gpg --with-colons --import-options show-only --import bobine.gpg | awk -F: '/^fpr:/ { print $10; exit }')
          echo "Detected fingerprint: $FP"
          test "$FP" = "B77D96D72F84F36ACAA3F8729CBF497D829EE15A"

      - name: Verify Web Hub Assets & Zero-Emoji Policy
        run: |
          test -f index.html
          test -f fr/index.html
          test -f pong/index.html
          test -f fr/pong/index.html
          test -s assets/site.css
          test -s assets/site.js
          test -s assets/pong.js
          test -s assets/pong.css
          test -s assets/bobine-tokens.css
          test -f logo_bobine_entier.png
          test -f CNAME
          test -f .nojekyll
          test -f robots.txt
          test -f sitemap.xml
          test -f llms.txt
          grep -q "packages.bobine.fit" CNAME
          if grep -q "brand-pill" index.html fr/index.html; then
            echo "ERROR: brand-pill found in index.html"
            exit 1
          fi
          for icon in debian ubuntu linuxmint popos zorin raspberrypi fedora nobara rhel almalinux rockylinux opensuse arch endeavouros cachyos manjaro; do
            test -s "icons/distros/${icon}.svg"
          done
          for os in linux windows apple android framework tor; do
            test -s "icons/os/${os}.svg"
          done
          for chip in intel amd snapdragon; do
            test -s "icons/chips/${chip}.svg"
          done
          for browser in firefox chrome edge safari brave torbrowser; do
            test -s "icons/browsers/${browser}.svg"
          done

      - name: Verify portal sources (generated pages, no fixed colors, Pong naming)
        run: node scripts/check-portal.mjs

      - name: Verify the design tokens match BobineWeb
        run: |
          curl -fsSL https://raw.githubusercontent.com/FantasmaGlad/BobineWeb/main/public/bobine-tokens.css -o /tmp/bobine-tokens.css
          cmp /tmp/bobine-tokens.css assets/bobine-tokens.css || { echo "::error::assets/bobine-tokens.css differs from BobineWeb/public/bobine-tokens.css : copy the generated file"; exit 1; }

      - name: Verify portal links and local previews
        run: |
          set -euo pipefail
          test -s favicon.ico
          test -s og-image.webp
          for family in debian fedora arch; do test -s "$family/index.html"; done
          if grep -nE 'bobine.fit/(og-image.png|en/ordinateur|en/securite|fr/materiel"|en/hardware")' index.html fr/index.html pong/index.html fr/pong/index.html; then
            echo "ERROR: obsolete portal link"
            exit 1
          fi
          for page in index.html fr/index.html pong/index.html fr/pong/index.html; do
            grep -q 'https://packages.bobine.fit/og-image.webp' "$page"
          done

      - name: Verify Published Repository Signatures (if present on branch)
        run: |
          gpg --import bobine.gpg
          if [ -d debian/dists ]; then
            for rel in $(find debian/dists -name "InRelease"); do
              echo "Verifying APT $rel..."
              gpg --verify "$rel"
            done
          fi
          if [ -d fedora ]; then
            for asc in $(find fedora -name "repomd.xml.asc"); do
              xml="${asc%.asc}"
              echo "Verifying DNF $asc against $xml..."
              gpg --verify "$asc" "$xml"
            done
          fi
          if [ -d arch ]; then
            for sig in $(find arch -name "*.sig"); do
              target="${sig%.sig}"
              if [ -f "$target" ]; then
                echo "Verifying Pacman $sig against $target..."
                gpg --verify "$sig" "$target"
              fi
            done
          fi

  publish-portal:
    name: Publish validated portal
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-portal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 0
      - name: Copy portal assets and repository indexes
        run: |
          set -euo pipefail
          cd source
          git ls-files -z -- '*.html' 'assets/**' 'icons/**' 'favicon.ico' 'og-image.webp' 'logo_bobine_entier.png' 'robots.txt' 'sitemap.xml' 'llms.txt' 'CNAME' '.nojekyll' |
            tar --null -T - -cf - | tar -xf - -C ../published
      - name: Publish without replacing package binaries
        working-directory: published
        run: |
          set -euo pipefail
          git config user.name fanta
          git config user.email 193235053+FantasmaGlad@users.noreply.github.com
          git add -- '*.html' assets icons favicon.ico og-image.webp logo_bobine_entier.png robots.txt sitemap.xml llms.txt CNAME .nojekyll
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(portail): synchroniser les liens et ressources validés"
          for attempt in 1 2 3; do
            git pull --rebase origin gh-pages
            if git push origin HEAD:gh-pages; then exit 0; fi
          done
          exit 1
