name: Verify Package Repository Integrity

on:
  push:
    branches: [main, gh-pages]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Cryptographic & Structural Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify OpenPGP Public Key
        run: |
          test -f bobine.gpg
          FP=$(gpg --with-colons --import-options show-only --import bobine.gpg | awk -F: '/^fpr:/ { print $10; exit }')
          echo "Detected fingerprint: $FP"
          test "$FP" = "B77D96D72F84F36ACAA3F8729CBF497D829EE15A"

      - name: Verify Web Hub Assets & Zero-Emoji Policy
        run: |
          test -f index.html
          test -f fr/index.html
          test -f pong/index.html
          test -f logo_bobine_entier.png
          test -f CNAME
          test -f .nojekyll
          test -f robots.txt
          test -f sitemap.xml
          test -f llms.txt
          grep -q "packages.bobine.fit" CNAME
          if grep -q "brand-pill" index.html fr/index.html; then
            echo "ERROR: brand-pill found in index.html"
            exit 1
          fi
          for icon in debian ubuntu linuxmint popos zorin raspberrypi fedora nobara rhel almalinux rockylinux opensuse arch endeavouros cachyos manjaro; do
            test -s "icons/distros/${icon}.svg"
          done
          for os in linux windows apple android framework tor; do
            test -s "icons/os/${os}.svg"
          done
          for chip in intel amd snapdragon; do
            test -s "icons/chips/${chip}.svg"
          done
          for browser in firefox chrome edge safari brave torbrowser; do
            test -s "icons/browsers/${browser}.svg"
          done

      - name: Verify Published Repository Signatures (if present on branch)
        run: |
          gpg --import bobine.gpg
          if [ -d debian/dists ]; then
            for rel in $(find debian/dists -name "InRelease"); do
              echo "Verifying APT $rel..."
              gpg --verify "$rel"
            done
          fi
          if [ -d fedora ]; then
            for asc in $(find fedora -name "repomd.xml.asc"); do
              xml="${asc%.asc}"
              echo "Verifying DNF $asc against $xml..."
              gpg --verify "$asc" "$xml"
            done
          fi
          if [ -d arch ]; then
            for sig in $(find arch -name "*.sig"); do
              target="${sig%.sig}"
              if [ -f "$target" ]; then
                echo "Verifying Pacman $sig against $target..."
                gpg --verify "$sig" "$target"
              fi
            done
          fi
