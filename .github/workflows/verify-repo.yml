name: Verify Package Repository Integrity

on:
  push:
    branches: [main, gh-pages]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Cryptographic & Structural Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify OpenPGP Public Key
        run: |
          test -f bobine.gpg
          FP=$(gpg --with-colons --import-options show-only --import bobine.gpg | awk -F: '/^fpr:/ { print $10; exit }')
          echo "Detected fingerprint: $FP"
          test "$FP" = "B77D96D72F84F36ACAA3F8729CBF497D829EE15A"

      - name: Verify portal pages
        run: |
          test -f index.html
          test -f fr/index.html
          test -s assets/site.css
          test -s favicon.ico
          for f in CNAME .nojekyll robots.txt sitemap.xml llms.txt; do test -f "$f"; done
          grep -q "packages.bobine.fit" CNAME
          for family in debian fedora arch; do test -s "$family/index.html"; done
          node scripts/check-portal.mjs

      - name: Verify Published Repository Signatures (if present on branch)
        run: |
          gpg --import bobine.gpg
          if [ -d debian/dists ]; then
            for rel in $(find debian/dists -name "InRelease"); do
              echo "Verifying APT $rel..."
              gpg --verify "$rel"
            done
          fi
          if [ -d fedora ]; then
            for asc in $(find fedora -name "repomd.xml.asc"); do
              xml="${asc%.asc}"
              echo "Verifying DNF $asc against $xml..."
              gpg --verify "$asc" "$xml"
            done
          fi
          if [ -d arch ]; then
            for sig in $(find arch -name "*.sig"); do
              target="${sig%.sig}"
              if [ -f "$target" ]; then
                echo "Verifying Pacman $sig against $target..."
                gpg --verify "$sig" "$target"
              fi
            done
          fi

  publish-portal:
    name: Publish validated portal
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-portal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 0
      - name: Copy portal assets and repository indexes
        run: |
          set -euo pipefail
          cd source
          git ls-files -z -- '*.html' 'assets/**' 'favicon.ico' 'robots.txt' 'sitemap.xml' 'llms.txt' 'CNAME' '.nojekyll' '.well-known/**' |
            tar --null -T - -cf - | tar -xf - -C ../published
      - name: Remove retired portal files
        working-directory: published
        run: |
          git rm -rq --ignore-unmatch -- pong fr/pong icons assets/channels og-image.webp logo_bobine_entier.png \
            assets/pong.css assets/pong.js assets/site.js assets/NOTICE.md assets/branding-source.json \
            assets/bobine-controls.css assets/bobine-themes.json assets/bobine-tokens.css
      - name: Publish without replacing package binaries
        working-directory: published
        run: |
          set -euo pipefail
          git config user.name fanta
          git config user.email 193235053+FantasmaGlad@users.noreply.github.com
          git add -- '*.html' assets .well-known favicon.ico robots.txt sitemap.xml llms.txt CNAME .nojekyll
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(portail): synchroniser les liens et ressources validés"
          for attempt in 1 2 3; do
            git pull --rebase origin gh-pages
            if git push origin HEAD:gh-pages; then exit 0; fi
          done
          exit 1
